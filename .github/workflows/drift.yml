name: Tooling drift

# Thin caller, like ci.yml and pr-title.yml beside it: the check itself lives in
# trajectonomics/cicd and is shared by every package. The three callers together are the
# whole CI contract, so a repository made from this template starts current instead of
# starting with a copy of the rules.
#
#   weekly       -> one issue per repository naming a stale pin or a Biome rule of its own,
#                   updated in place, and closed when nothing is stale
#   Run workflow -> the same check, on demand
#
# The schedule belongs in the caller: a reusable workflow's own schedule does not fire for
# the repositories that call it. GitHub turns a schedule off after 60 days without
# repository activity, and a disabled workflow cannot be dispatched; turn it back on with
# `gh workflow enable drift.yml`.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read # check this repository out
  issues: write # open, update and close the drift issue

jobs:
  drift:
    uses: trajectonomics/cicd/.github/workflows/drift.yml@v1
